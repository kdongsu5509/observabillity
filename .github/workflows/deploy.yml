name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect OIDC claims
        shell: bash
        run: |
          token="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)"
          echo "$token" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{iss,sub,aud,repository,ref}'
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Find the running observability host
        id: host
        shell: bash
        run: |
          instance_id="$(aws ec2 describe-instances \
            --filters 'Name=tag:Name,Values=observability-host' 'Name=instance-state-name,Values=running' \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          if [ -z "$instance_id" ] || [ "$instance_id" = "None" ]; then
            echo "No running observability-host instance was found. Deploy the CloudFormation stack first."
            exit 1
          fi
          echo "instance_id=$instance_id" >> "$GITHUB_OUTPUT"
      - name: Deploy through AWS Systems Manager
        id: command
        shell: bash
        env:
          INSTANCE_ID: ${{ steps.host.outputs.instance_id }}
        run: |
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy observabillity ${GITHUB_SHA}" \
            --parameters 'commands=["set -euxo pipefail","cd /opt/observability/app","git fetch origin main","git reset --hard origin/main","docker compose pull","docker compose up -d --build --remove-orphans","docker image prune -f"]' \
            --query 'Command.CommandId' --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
      - name: Wait for deployment
        shell: bash
        env:
          INSTANCE_ID: ${{ steps.host.outputs.instance_id }}
          COMMAND_ID: ${{ steps.command.outputs.command_id }}
        run: |
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' --output json
