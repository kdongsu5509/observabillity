<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Loki 로그 쓰기와 읽기 아키텍처</title>
  <desc id="desc">결혼 서비스 로그가 Alloy를 거쳐 Distributor, Ingester, 인덱스와 청크 저장소로 들어가고 Grafana의 LogQL 조회가 Query frontend와 Querier를 거쳐 결과를 받는 흐름</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfdfb"/>
      <stop offset="1" stop-color="#f1f7f3"/>
    </linearGradient>
    <linearGradient id="write" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6db"/>
      <stop offset="1" stop-color="#f9d25e"/>
    </linearGradient>
    <linearGradient id="read" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5f2ff"/>
      <stop offset="1" stop-color="#a9d3ff"/>
    </linearGradient>
    <linearGradient id="store" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f8ed"/>
      <stop offset="1" stop-color="#a9dfbe"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#17352a" flood-opacity=".13"/>
    </filter>
    <marker id="arrow-write" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#c88a00"/>
    </marker>
    <marker id="arrow-read" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#2a73b8"/>
    </marker>
    <marker id="arrow-store" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#268052"/>
    </marker>
    <style>
      text { font-family: Inter, "Noto Sans KR", Arial, sans-serif; fill: #17352a; }
      .title { font-size: 29px; font-weight: 800; letter-spacing: -.04em; }
      .sub { font-size: 14px; fill: #5c7166; }
      .group-title { font-size: 14px; font-weight: 800; letter-spacing: .08em; }
      .node-title { font-size: 17px; font-weight: 800; }
      .node-copy { font-size: 12px; fill: #51675b; }
      .node { stroke-width: 2; }
      .tag { font-size: 11px; font-weight: 800; }
      .line { fill: none; stroke-width: 3; stroke-linecap: round; }
      .legend { font-size: 12px; fill: #5c7166; }
    </style>
  </defs>
  <rect width="1200" height="760" rx="18" fill="url(#paper)"/>
  <text x="54" y="60" class="title">Loki architecture</text>
  <text x="54" y="88" class="sub">로그는 라벨로 스트림을 찾고, 본문은 압축 청크로 저장합니다.</text>

  <rect x="42" y="118" width="1116" height="175" rx="14" fill="#fffaf0" stroke="#ead8a8"/>
  <text x="66" y="148" class="group-title" fill="#a66e00">WRITE PATH · 쓰기 경로</text>
  <text x="66" y="170" class="sub">Alloy가 보낸 로그를 Distributor가 분배하고 Ingester가 청크와 WAL에 기록합니다.</text>

  <g filter="url(#shadow)">
    <rect class="node" x="70" y="201" width="178" height="68" rx="10" fill="url(#write)" stroke="#e3a900"/>
    <text x="88" y="229" class="node-title">결혼 서비스 + Alloy</text>
    <text x="88" y="250" class="node-copy">POST /loki/api/v1/push</text>
  </g>
  <path class="line" d="M248 235H300" stroke="#c88a00" marker-end="url(#arrow-write)"/>
  <g filter="url(#shadow)">
    <rect class="node" x="302" y="201" width="178" height="68" rx="10" fill="url(#write)" stroke="#e3a900"/>
    <text x="321" y="229" class="node-title">Distributor</text>
    <text x="321" y="250" class="node-copy">검증 · 해시 링 · 복제</text>
  </g>
  <path class="line" d="M480 235H533" stroke="#c88a00" marker-end="url(#arrow-write)"/>
  <g filter="url(#shadow)">
    <rect class="node" x="535" y="201" width="178" height="68" rx="10" fill="url(#write)" stroke="#e3a900"/>
    <text x="554" y="229" class="node-title">Ingester</text>
    <text x="554" y="250" class="node-copy">메모리 청크 · WAL · ACK</text>
  </g>
  <path class="line" d="M713 235H766" stroke="#c88a00" marker-end="url(#arrow-write)"/>
  <g filter="url(#shadow)">
    <rect class="node" x="768" y="201" width="178" height="68" rx="10" fill="url(#write)" stroke="#e3a900"/>
    <text x="787" y="229" class="node-title">Index shipper</text>
    <text x="787" y="250" class="node-copy">TSDB 인덱스 파일 전달</text>
  </g>
  <path class="line" d="M946 235H997" stroke="#268052" marker-end="url(#arrow-store)"/>
  <g filter="url(#shadow)">
    <rect class="node" x="999" y="201" width="135" height="68" rx="10" fill="url(#store)" stroke="#4ca675"/>
    <text x="1018" y="229" class="node-title">Object store</text>
    <text x="1018" y="250" class="node-copy">index + chunks</text>
  </g>

  <rect x="42" y="325" width="1116" height="150" rx="14" fill="#f1faf4" stroke="#b8dfc7"/>
  <text x="66" y="355" class="group-title" fill="#227248">STORAGE · 저장 형식</text>
  <text x="66" y="377" class="sub">같은 라벨 집합의 로그가 하나의 스트림이 되고, 인덱스는 위치를, 청크는 본문을 가리킵니다.</text>
  <g filter="url(#shadow)">
    <rect class="node" x="104" y="402" width="285" height="45" rx="9" fill="url(#store)" stroke="#4ca675"/>
    <text x="128" y="430" class="node-title">TSDB index</text>
    <text x="247" y="430" class="node-copy">라벨 → 청크 위치</text>
    <rect x="292" y="413" width="74" height="22" rx="11" fill="#fff" opacity=".8"/>
    <text x="307" y="428" class="tag" fill="#227248">찾기</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="node" x="457" y="402" width="285" height="45" rx="9" fill="url(#store)" stroke="#4ca675"/>
    <text x="481" y="430" class="node-title">Compressed chunks</text>
    <text x="665" y="430" class="node-copy">시간 + 로그 본문</text>
  </g>
  <path class="line" d="M742 424H805" stroke="#268052" marker-end="url(#arrow-store)"/>
  <g filter="url(#shadow)">
    <rect class="node" x="807" y="402" width="290" height="45" rx="9" fill="#fff" stroke="#b8cfc0"/>
    <text x="831" y="430" class="node-title">보존 정책</text>
    <text x="935" y="430" class="node-copy">retention · compactor</text>
  </g>

  <rect x="42" y="507" width="1116" height="192" rx="14" fill="#f1f7ff" stroke="#b7d4ee"/>
  <text x="66" y="537" class="group-title" fill="#2a73b8">READ PATH · 읽기 경로</text>
  <text x="66" y="559" class="sub">Grafana의 LogQL을 Query frontend가 나누고 Querier가 최근 메모리와 과거 저장소를 합칩니다.</text>
  <g filter="url(#shadow)">
    <rect class="node" x="70" y="596" width="180" height="68" rx="10" fill="url(#read)" stroke="#4c91cc"/>
    <text x="89" y="624" class="node-title">Grafana Explore</text>
    <text x="89" y="645" class="node-copy">LogQL · 시간 범위</text>
  </g>
  <path class="line" d="M250 630H304" stroke="#2a73b8" marker-end="url(#arrow-read)"/>
  <g filter="url(#shadow)">
    <rect class="node" x="306" y="596" width="185" height="68" rx="10" fill="url(#read)" stroke="#4c91cc"/>
    <text x="324" y="624" class="node-title">Query frontend</text>
    <text x="324" y="645" class="node-copy">분할 · 스케줄 · 병합</text>
  </g>
  <path class="line" d="M491 630H545" stroke="#2a73b8" marker-end="url(#arrow-read)"/>
  <g filter="url(#shadow)">
    <rect class="node" x="547" y="596" width="185" height="68" rx="10" fill="url(#read)" stroke="#4c91cc"/>
    <text x="565" y="624" class="node-title">Querier</text>
    <text x="565" y="645" class="node-copy">최근 + 과거 조회</text>
  </g>
  <path class="line" d="M732 630H790" stroke="#2a73b8" marker-end="url(#arrow-read)"/>
  <g filter="url(#shadow)">
    <rect class="node" x="792" y="580" width="155" height="44" rx="9" fill="url(#store)" stroke="#4ca675"/>
    <text x="812" y="607" class="node-title">Ingester</text>
    <text x="881" y="607" class="node-copy">최근</text>
    <rect class="node" x="792" y="636" width="155" height="44" rx="9" fill="url(#store)" stroke="#4ca675"/>
    <text x="812" y="663" class="node-title">Object store</text>
    <text x="905" y="663" class="node-copy">과거</text>
  </g>
  <path class="line" d="M947 602H1002" stroke="#268052" marker-end="url(#arrow-store)"/>
  <path class="line" d="M947 658H1002" stroke="#268052" marker-end="url(#arrow-store)"/>
  <g filter="url(#shadow)">
    <rect class="node" x="1004" y="606" width="130" height="49" rx="9" fill="#fff" stroke="#b7d4ee"/>
    <text x="1027" y="636" class="node-title">결과 병합</text>
  </g>
  <circle cx="72" cy="730" r="5" fill="#e3a900"/><text x="84" y="734" class="legend">쓰기</text>
  <circle cx="145" cy="730" r="5" fill="#4c91cc"/><text x="157" y="734" class="legend">읽기</text>
  <circle cx="220" cy="730" r="5" fill="#4ca675"/><text x="232" y="734" class="legend">저장소</text>
  <text x="1040" y="734" class="legend" text-anchor="end">BIBBIDI / OBSERVABILITY</text>
</svg>
