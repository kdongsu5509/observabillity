AWSTemplateFormatVersion: '2010-09-09'
Description: One t4g.small EC2 host for the Observabillity Docker stack in an existing default VPC.

Parameters:
  RepositoryUrl:
    Type: String
    Description: HTTPS clone URL of the public repository containing this project.
  RepositoryBranch:
    Type: String
    Default: main
  GrafanaAdminPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: Bootstrap password for the Grafana admin account.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-08668535b6694f809
    Description: Existing default VPC in ap-northeast-2. This stack does not create a VPC.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-0753c8a3651196a92
    Description: Existing default subnet in ap-northeast-2a. This stack does not create a subnet.
  UbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/arm64/hvm/ebs-gp3/ami-id

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP access and SSM-managed EC2 host.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
  HostRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: [ec2.amazonaws.com]}
            Action: ['sts:AssumeRole']
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
  HostProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref HostRole]
  Host:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref UbuntuAmi
      InstanceType: t4g.small
      IamInstanceProfile: !Ref HostProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref SecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 40
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates curl git docker.io docker-compose-v2
          systemctl enable --now docker
          install -d -m 0750 /opt/observability
          git clone --depth 1 --branch '${RepositoryBranch}' '${RepositoryUrl}' /opt/observability/app
          cat > /opt/observability/app/.env <<'ENV'
          GRAFANA_ADMIN_PASSWORD=${GrafanaAdminPassword}
          GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
          ENV
          chmod 600 /opt/observability/app/.env
          cd /opt/observability/app
          docker compose pull
          docker compose up -d --build --remove-orphans
          docker image prune -f
      Tags: [{Key: Name, Value: observability-host}]
Outputs:
  PublicIp:
    Value: !GetAtt Host.PublicIp
  SiteUrl:
    Value: !Sub http://${Host.PublicIp}/
  GrafanaUrl:
    Value: !Sub http://${Host.PublicIp}/grafana/
  SsmCommand:
    Value: !Sub aws ssm start-session --target ${Host}
