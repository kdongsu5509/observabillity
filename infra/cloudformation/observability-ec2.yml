AWSTemplateFormatVersion: '2010-09-09'
Description: Single public EC2 host for the Observabillity site, Grafana OSS, and telemetry stores.

Parameters:
  RepositoryUrl:
    Type: String
    Description: HTTPS clone URL of the repository containing this project.
  RepositoryBranch:
    Type: String
    Default: main
  GrafanaAdminPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: Bootstrap password for the Grafana admin account.
  SshCidr:
    Type: String
    Default: 0.0.0.0/32
    Description: CIDR allowed to reach SSH. Keep the default unless SSH is needed.
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium, t3.large]
  UbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{Key: Name, Value: observability-vpc}]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.42.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{Key: Name, Value: observability-public-subnet}]
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP and restricted SSH for the observability host.
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
  HostRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: [ec2.amazonaws.com]}
            Action: ['sts:AssumeRole']
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
  HostProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref HostRole]
  Host:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute
    Properties:
      ImageId: !Ref UbuntuAmi
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref HostProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref SecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 40
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates curl git docker.io docker-compose-v2
          systemctl enable --now docker
          install -d -m 0750 /opt/observability
          git clone --depth 1 --branch '${RepositoryBranch}' '${RepositoryUrl}' /opt/observability/app
          cat > /opt/observability/app/.env <<'ENV'
          GRAFANA_ADMIN_PASSWORD=${GrafanaAdminPassword}
          GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
          ENV
          cd /opt/observability/app
          docker compose pull
          docker compose up -d --build
          docker image prune -f
      Tags: [{Key: Name, Value: observability-host}]
  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref Host

Outputs:
  PublicIp:
    Value: !Ref ElasticIp
  SiteUrl:
    Value: !Sub http://${ElasticIp}/
  GrafanaUrl:
    Value: !Sub http://${ElasticIp}/grafana/
  SsmCommand:
    Value: !Sub aws ssm start-session --target ${Host}
