events {}
http {
  limit_req_zone $binary_remote_addr zone=site_per_ip:10m rate=12r/s;
  limit_req_zone $binary_remote_addr zone=grafana_per_ip:10m rate=8r/s;
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
  upstream site { server site:80; }
  upstream grafana { server grafana:3000; }
  server {
    listen 80;
    server_name _;
    client_max_body_size 2m;
    limit_conn conn_per_ip 24;
    location /grafana/ {
      limit_req zone=grafana_per_ip burst=20 nodelay;
      proxy_pass http://grafana;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 120s;
    }
    location / {
      limit_req zone=site_per_ip burst=30 nodelay;
      proxy_pass http://site;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
